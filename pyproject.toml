[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgmirror"
version = "0.1.0"
description = "Config-driven incremental mirror of Postgres tables from several sources into one database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["psycopg2-binary>=2.9", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pgserver>=0.1"]

[project.scripts]
pgmirror = "pgmirror.cli:main"

[tool.setuptools]
packages = ["pgmirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Explicit, so a global ruff config on someone's machine cannot change the verdict.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
